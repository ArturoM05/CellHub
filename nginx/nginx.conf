# nginx/nginx.conf
# Patrón Estrangulador: bifurca el tráfico según versión de API
#   /api/v1/  →  Monolito Django (legacy)
#   /api/v2/  →  Microservicio Flask (nuevo)

upstream django_web {
    server django_web:8000;
}

upstream flask_payment_service {
    server flask_payment_service:5000;
}

server {
    listen 80;

    # ── Microservicio Flask (Estrangulado) ─────────────────────────────────
    
    location /api/v2/payments/ {
        proxy_pass         http://flask_payment_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Monolito Django (Legacy) ───────────────────────────────────────────
    location / {
        proxy_pass         http://django_web;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
