version: "3.9"

services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cellhub_db
    environment:
      POSTGRES_DB:       cellhub_db
      POSTGRES_USER:     cellhub_user
      POSTGRES_PASSWORD: cellhub_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellhub_user -d cellhub_db"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cellhub_network

  # ── Monolito Django (Legacy) ───────────────────────────────────────────────
  django_web:
    build: .
    container_name: cellhub_django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      DATABASE_URL: postgres://cellhub_user:cellhub_pass@db:5432/cellhub_db
      DEBUG: "1"
      CELERY_BROKER_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      retries: 3
      start_period: 20s
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - cellhub_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Microservicio Flask (Estrangulado) ─────────────────────────────────────
  flask_payment_service:
    build: ./flask_payment_service
    container_name: cellhub_flask
    expose:
      - "5000"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - cellhub_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (Orquestador de tráfico / API Gateway) ──────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cellhub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_payment_service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cellhub_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis (broker para Celery) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cellhub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cellhub_network
    command: redis-server --appendonly yes

  # ── Celery worker ──────────────────────────────────────────────────────────
  celery_worker:
    build: .
    container_name: cellhub_celery
    command: celery -A config.celery_app worker -l info --concurrency=2
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://cellhub_user:cellhub_pass@db:5432/cellhub_db
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - db
      - django_web
    restart: unless-stopped
    networks:
      - cellhub_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  cellhub_network:
    driver: bridge
